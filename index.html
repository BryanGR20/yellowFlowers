<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Flores amarillas para ti 💛</title>

    <style>

        /* ==========================================
           GENERAL
        ========================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            overflow: hidden;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 70% 75%,
                    #183b2a 0%,
                    transparent 32%
                ),
                linear-gradient(
                    145deg,
                    #07131d,
                    #102d30 60%,
                    #0b1e19
                );
        }


        /* ==========================================
           ESCENA
        ========================================== */

        .scene {
            position: relative;

            width: 100%;
            min-height: 100vh;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }


        /* ==========================================
           PANTALLA INICIAL
        ========================================== */

        .intro {
            position: relative;

            z-index: 50;

            text-align: center;

            transition:
                opacity .8s ease,
                transform .8s ease;
        }


        .intro.hide {
            opacity: 0;

            transform:
                scale(.9);

            pointer-events: none;
        }


        .intro h1 {
            margin:
                0 0 12px;

            color:
                #ffe36a;

            font-size:
                clamp(
                    2rem,
                    8vw,
                    4rem
                );

            text-shadow:
                0 0 20px
                rgba(
                    255,
                    227,
                    106,
                    .15
                );
        }


        .intro p {
            margin:
                0 0 25px;

            color:
                #fff4c2;

            font-size:
                18px;
        }


        .intro button {
            border: none;

            border-radius:
                999px;

            padding:
                15px 28px;

            font-size:
                17px;

            font-weight:
                bold;

            background:
                #f5ca36;

            color:
                #352600;

            box-shadow:
                0 0 25px
                rgba(
                    255,
                    216,
                    75,
                    .35
                );

            cursor:
                pointer;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }


        .intro button:hover {
            transform:
                scale(1.06);

            box-shadow:
                0 0 35px
                rgba(
                    255,
                    216,
                    75,
                    .55
                );
        }


        .intro button:active {
            transform:
                scale(.96);
        }


        /* ==========================================
           CARTA
        ========================================== */

        .letter {
            position: absolute;

            left: 6%;
            top: 13%;

            width:
                min(
                    39%,
                    450px
                );

            opacity: 0;

            z-index: 30;

            color:
                #fff6cf;

            font-size:
                clamp(
                    1.05rem,
                    2.1vw,
                    1.5rem
                );

            line-height:
                1.65;

            text-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    .8
                );

            transition:
                opacity 1s ease;
        }


        .letter.show {
            opacity: 1;
        }


        #typed {
            white-space:
                pre-line;
        }


        /* ==========================================
           CURSOR
        ========================================== */

        .cursor {
            display:
                inline-block;

            width:
                2px;

            height:
                1em;

            margin-left:
                3px;

            vertical-align:
                -2px;

            background:
                #ffe36a;

            animation:
                blink .7s infinite;
        }


        @keyframes blink {

            50% {
                opacity: 0;
            }

        }


        /* ==========================================
           FIRMA
        ========================================== */

        .signature {
            margin-top:
                22px;

            opacity: 0;

            color:
                #ffe36a;

            font-size:
                1.05em;

            font-weight:
                bold;

            font-style:
                italic;

            transform:
                translateY(10px);

            transition:
                opacity 1.5s ease,
                transform 1.5s ease;

            text-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    .8
                );
        }


        .signature.show {
            opacity: 1;

            transform:
                translateY(0);
        }


        /* ==========================================
           RAMO
        ========================================== */

        .bouquet {
            position: absolute;

            right: 5%;
            bottom: 3%;

            width: 540px;
            height: 650px;

            opacity: 0;

            transform-origin:
                bottom center;

            transition:
                opacity .5s ease;
        }


        .bouquet.show {
            opacity: 1;
        }


        /* ==========================================
           FLORES
        ========================================== */

        .flower {
            position: absolute;

            left: 50%;
            bottom: 80px;

            width: 110px;
            height: 110px;

            opacity: 0;

            transform-origin:
                50% 170%;

            transform:
                translate(
                    -50%,
                    40px
                )
                rotate(
                    var(--r)
                )
                scale(.15);

            transition:
                opacity .65s ease,
                transform 1.1s
                cubic-bezier(
                    .2,
                    .8,
                    .2,
                    1
                );
        }


        .flower.grow {
            opacity: 1;

            transform:
                translate(
                    calc(
                        -50%
                        + var(--x)
                    ),
                    var(--y)
                )
                rotate(
                    var(--r)
                )
                scale(
                    var(--s)
                );
        }


        /* ==========================================
           TALLOS
        ========================================== */

        .stem {
            position: absolute;

            width: 6px;
            height: 250px;

            left: 52px;
            top: 53px;

            z-index: -1;

            border-radius:
                6px;

            transform-origin:
                top;

            background:
                linear-gradient(
                    90deg,
                    #164a2a,
                    #4c9a4b,
                    #153b25
                );
        }


        /* ==========================================
           PÉTALOS
        ========================================== */

        .petal {
            position: absolute;

            left: 41px;
            top: 9px;

            width: 28px;
            height: 55px;

            border-radius:
                60%
                60%
                45%
                45%;

            transform-origin:
                14px
                46px;

            background:
                linear-gradient(
                    #fff47d,
                    #ffc928
                );

            box-shadow:
                0 0 8px
                rgba(
                    255,
                    215,
                    57,
                    .35
                );
        }


        /* ==========================================
           CENTRO FLOR
        ========================================== */

        .center {
            position: absolute;

            left: 35px;
            top: 35px;

            width: 40px;
            height: 40px;

            z-index: 3;

            border-radius:
                50%;

            background:
                radial-gradient(
                    circle at
                    35% 30%,
                    #9d7128,
                    #4d2a0b 72%
                );
        }


        /* ==========================================
           PAPEL
        ========================================== */

        .wrap {
            position: absolute;

            left: 50%;
            bottom: 18px;

            width: 270px;
            height: 165px;

            z-index: 5;

            opacity: 0;

            transform:
                translateX(-50%);

            clip-path:
                polygon(
                    8% 0,
                    92% 0,
                    68% 100%,
                    32% 100%
                );

            background:
                linear-gradient(
                    135deg,
                    #f0d9a7,
                    #c89f61
                );

            transition:
                opacity 1s ease;
        }


        .wrap.show {
            opacity: .92;
        }


        /* ==========================================
           CINTA
        ========================================== */

        .ribbon {
            position: absolute;

            left: 50%;
            bottom: 82px;

            width: 110px;
            height: 24px;

            z-index: 7;

            opacity: 0;

            border-radius:
                50%;

            transform:
                translateX(-50%);

            background:
                #d7a926;

            transition:
                opacity 1s ease;
        }


        .ribbon.show {
            opacity: 1;
        }


        /* ==========================================
           LUCES
        ========================================== */

        .spark {
            position: absolute;

            width: 5px;
            height: 5px;

            z-index: 1;

            border-radius:
                50%;

            background:
                #fff3a4;

            opacity: .5;

            pointer-events:
                none;

            animation:
                float 5s
                linear infinite;
        }


        @keyframes float {

            from {
                transform:
                    translateY(0);
            }

            to {
                transform:
                    translateY(-90px);

                opacity: 0;
            }

        }


        /* ==========================================
           TABLET
        ========================================== */

        @media (
            max-width: 900px
        ) {

            .letter {
                left: 5%;
                width: 44%;

                font-size:
                    1.05rem;
            }


            .bouquet {
                right: -3%;

                transform:
                    scale(.82);

                transform-origin:
                    bottom right;
            }

        }


        /* ==========================================
           CELULAR
        ========================================== */

        @media (
            max-width: 650px
        ) {

            body {
                overflow: hidden;
            }


            .scene {
                min-height:
                    100vh;

                overflow:
                    hidden;

                padding:
                    14px;
            }


            /* ======================
               INICIO
            ====================== */

            .intro {
                margin-top:
                    -60px;

                padding:
                    0 15px;
            }


            .intro h1 {
                font-size:
                    clamp(
                        2rem,
                        10vw,
                        3rem
                    );
            }


            .intro p {
                font-size:
                    16px;
            }


            /* ======================
               CARTA
            ====================== */

            .letter {
                left:
                    6%;

                top:
                    5%;

                width:
                    88%;

                font-size:
                    clamp(
                        .9rem,
                        4vw,
                        1.02rem
                    );

                line-height:
                    1.4;
            }


            .signature {
                margin-top:
                    12px;

                font-size:
                    1rem;
            }


            /* ======================
               RAMO
            ====================== */

            .bouquet {

                /*
                 * En celular dejamos de
                 * posicionarlo desde la derecha.
                 *
                 * Lo centramos respecto a
                 * toda la pantalla.
                 */

                left:
                    50%;

                right:
                    auto;

                bottom:
                    -55px;

                width:
                    540px;

                height:
                    650px;

                /*
                 * Todo el ramo se reduce
                 * proporcionalmente.
                 */

                transform:
                    translateX(-50%)
                    scale(.53);

                transform-origin:
                    bottom center;
            }


            .wrap {
                width:
                    280px;
            }

        }


        /* ==========================================
           CELULAR <= 430px
        ========================================== */

        @media (
            max-width: 430px
        ) {

            .letter {
                left:
                    5%;

                top:
                    4%;

                width:
                    90%;

                font-size:
                    .92rem;

                line-height:
                    1.38;
            }


            .signature {
                margin-top:
                    10px;

                font-size:
                    .96rem;
            }


            .bouquet {
                left:
                    50%;

                right:
                    auto;

                bottom:
                    -65px;

                width:
                    540px;

                height:
                    650px;

                transform:
                    translateX(-50%)
                    scale(.48);

                transform-origin:
                    bottom center;
            }

        }


        /* ==========================================
           CELULARES PEQUEÑOS <= 375px
        ========================================== */

        @media (
            max-width: 375px
        ) {

            .letter {
                top:
                    3%;

                font-size:
                    .86rem;

                line-height:
                    1.34;
            }


            .signature {
                margin-top:
                    8px;

                font-size:
                    .92rem;
            }


            .bouquet {
                bottom:
                    -70px;

                transform:
                    translateX(-50%)
                    scale(.43);
            }

        }


        /* ==========================================
           CELULARES BAJOS
        ========================================== */

        @media (
            max-height: 700px
        )
        and
        (
            max-width: 650px
        ) {

            .letter {
                top:
                    3%;

                font-size:
                    .84rem;

                line-height:
                    1.3;
            }


            .signature {
                margin-top:
                    7px;
            }


            .bouquet {
                bottom:
                    -90px;

                transform:
                    translateX(-50%)
                    scale(.42);
            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     MÚSICA
========================================== -->

<audio
    id="backgroundMusic"
    loop
>

    <source
        src="audio.mp3"
        type="audio/mpeg"
    >

    <source
        src="audio.mp4"
        type="audio/mp4"
    >

</audio>



<!-- ==========================================
     ESCENA
========================================== -->

<main
    class="scene"
>


    <!-- ======================================
         PANTALLA INICIAL
    ======================================= -->

    <section
        class="intro"
        id="intro"
    >

        <h1>
            Tengo algo para ti 💛
        </h1>

        <p>
            Haz clic y mira cómo florece.
        </p>

        <button
            id="open"
            type="button"
        >

            Toca aquí 🌻

        </button>

    </section>



    <!-- ======================================
         MENSAJE
    ======================================= -->

    <div
        class="letter"
        id="letter"
    >

        <span
            id="typed"
        ></span>

        <span
            class="cursor"
            id="cursor"
        ></span>


        <!--
            La firma está dentro de letter.

            Así nunca se cruza con
            el texto de arriba.
        -->

        <div
            class="signature"
            id="signature"
        >

            Con amor, Bryan ❤️

        </div>

    </div>



    <!-- ======================================
         RAMO
    ======================================= -->

    <div
        class="bouquet"
        id="bouquet"
    >

        <div
            class="wrap"
            id="wrap"
        ></div>


        <div
            class="ribbon"
            id="ribbon"
        ></div>

    </div>


</main>



<script>

/* ==========================================
   ELEMENTOS
========================================== */

const intro =
    document.getElementById(
        "intro"
    );


const bouquet =
    document.getElementById(
        "bouquet"
    );


const letter =
    document.getElementById(
        "letter"
    );


const typed =
    document.getElementById(
        "typed"
    );


const wrap =
    document.getElementById(
        "wrap"
    );


const ribbon =
    document.getElementById(
        "ribbon"
    );


const btn =
    document.getElementById(
        "open"
    );


const music =
    document.getElementById(
        "backgroundMusic"
    );


const signature =
    document.getElementById(
        "signature"
    );


const cursor =
    document.getElementById(
        "cursor"
    );



/* ==========================================
   POSICIONES DEL RAMO
========================================== */

const positions = [

    [-150, -5, -27, .72],

    [-105, -95, -19, .82],

    [-45, -145, -9, .95],

    [20, -165, 3, 1.05],

    [85, -125, 13, .92],

    [145, -45, 25, .78],

    [-120, -175, -20, .75],

    [-65, -225, -11, .85],

    [5, -245, 1, 1],

    [75, -220, 12, .86],

    [125, -155, 21, .76],

    [-65, -310, -8, .72],

    [5, -330, 1, .8],

    [70, -300, 10, .72]

];



/* ==========================================
   CREAR UNA FLOR
========================================== */

function makeFlower(
    x,
    y,
    rotation,
    scale,
    index
) {

    const flower =
        document.createElement(
            "div"
        );


    flower.className =
        "flower";


    flower.style.setProperty(
        "--x",
        x + "px"
    );


    flower.style.setProperty(
        "--y",
        y + "px"
    );


    flower.style.setProperty(
        "--r",
        rotation + "deg"
    );


    flower.style.setProperty(
        "--s",
        scale
    );


    let petals =
        "";


    /* ==============================
       CREAR 10 PÉTALOS
    ============================== */

    for (
        let j = 0;
        j < 10;
        j++
    ) {

        petals += `

            <i
                class="petal"

                style="
                    transform:
                    rotate(${j * 36}deg)
                    translateY(-29px);
                "
            ></i>

        `;

    }


    flower.innerHTML = `

        <div
            class="stem"
        ></div>


        ${petals}


        <div
            class="center"
        ></div>

    `;


    bouquet.appendChild(
        flower
    );


    /* ==============================
       HACER CRECER LA FLOR
    ============================== */

    setTimeout(
        () => {

            flower
                .classList
                .add(
                    "grow"
                );

        },

        500
        +
        index * 260

    );

}



/* ==========================================
   ESCRIBIR MENSAJE
========================================== */

function typeMessage() {


    const message =

`Para ti, mi amor 💛

No quería dejar pasar este día
sin regalarte flores amarillas.

Que cada una te recuerde
lo especial que eres para mí

y lo bonito que es
tenerte en mi vida. 🌻💛`;


    let index =
        0;


    letter
        .classList
        .add(
            "show"
        );


    const typing =
        setInterval(
            () => {


                typed.textContent +=
                    message.charAt(
                        index
                    );


                index++;


                /* =========================
                   TERMINÓ DE ESCRIBIR
                ========================= */

                if (
                    index >=
                    message.length
                ) {


                    clearInterval(
                        typing
                    );


                    /* =====================
                       QUITAR CURSOR
                    ====================== */

                    setTimeout(
                        () => {

                            cursor.style.display =
                                "none";

                        },

                        350

                    );


                    /* =====================
                       MOSTRAR FIRMA
                    ====================== */

                    setTimeout(
                        () => {

                            signature
                                .classList
                                .add(
                                    "show"
                                );

                        },

                        800

                    );

                }

            },

            45

        );

}



/* ==========================================
   CLICK PRINCIPAL
========================================== */

btn.addEventListener(
    "click",

    () => {


        /*
         * Evitamos que pueda presionar
         * varias veces.
         */

        btn.disabled =
            true;


        /* ==============================
           INICIAR MÚSICA
        ============================== */

        music.volume =
            0.5;


        music
            .play()
            .catch(
                error => {

                    console.log(
                        "No se pudo iniciar la música:",
                        error
                    );

                }
            );


        /* ==============================
           OCULTAR INTRO
        ============================== */

        intro
            .classList
            .add(
                "hide"
            );


        /* ==============================
           MOSTRAR CONTENEDOR DEL RAMO
        ============================== */

        bouquet
            .classList
            .add(
                "show"
            );


        /* ==============================
           CREAR FLORES
        ============================== */

        positions.forEach(
            (
                position,
                index
            ) => {

                makeFlower(
                    ...position,
                    index
                );

            }
        );


        /* ==============================
           MOSTRAR PAPEL
        ============================== */

        setTimeout(
            () => {

                wrap
                    .classList
                    .add(
                        "show"
                    );

            },

            3600

        );


        /* ==============================
           MOSTRAR CINTA
        ============================== */

        setTimeout(
            () => {

                ribbon
                    .classList
                    .add(
                        "show"
                    );

            },

            3900

        );


        /* ==============================
           ESCRIBIR CARTA
        ============================== */

        setTimeout(
            () => {

                typeMessage();

            },

            4300

        );


    }
);



/* ==========================================
   CREAR LUCES DE FONDO
========================================== */

for (
    let i = 0;
    i < 25;
    i++
) {

    const spark =
        document.createElement(
            "span"
        );


    spark.className =
        "spark";


    spark.style.left =
        (
            Math.random()
            * 100
        )
        + "%";


    spark.style.top =
        (
            25
            +
            Math.random()
            * 70
        )
        + "%";


    spark.style.animationDelay =
        (
            -Math.random()
            * 5
        )
        + "s";


    spark.style.animationDuration =
        (
            4
            +
            Math.random()
            * 4
        )
        + "s";


    document.body.appendChild(
        spark
    );

}

</script>


</body>

</html>
