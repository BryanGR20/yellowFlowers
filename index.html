<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1">

<title>Un ramo para ti 💛</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;

    font-family: Georgia, serif;

    color: #fff;

    background:
        radial-gradient(
            circle at 70% 70%,
            #183b2a 0,
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #07131d,
            #102d30 60%,
            #0b1e19
        );
}


/* =========================
   ESCENA
========================= */

.scene {

    min-height: 100vh;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 24px;

}


/* =========================
   PANTALLA INICIAL
========================= */

.intro {

    text-align: center;

    z-index: 20;

    transition:
        opacity .8s ease,
        transform .8s ease;

}

.intro.hide {

    opacity: 0;

    transform:
        scale(.9);

    pointer-events:
        none;

}

.intro h1 {

    color:
        #ffe36a;

    font-size:
        clamp(
            2rem,
            9vw,
            4rem
        );

    margin:
        0 0 12px;

}

.intro p {

    color:
        #fff4c2;

    font-size:
        18px;

    margin-bottom:
        25px;

}

.intro button {

    border:
        none;

    border-radius:
        999px;

    padding:
        15px 28px;

    font-size:
        17px;

    font-weight:
        bold;

    background:
        #f5ca36;

    color:
        #352600;

    box-shadow:
        0 0 25px
        rgba(255, 216, 75, .35);

    cursor:
        pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;

}

.intro button:hover {

    transform:
        scale(1.06);

    box-shadow:
        0 0 35px
        rgba(255, 216, 75, .55);

}


/* =========================
   CARTA / MENSAJE
========================= */

.letter {

    position:
        absolute;

    left:
        6%;

    top:
        14%;

    width:
        min(
            38%,
            440px
        );

    opacity:
        0;

    z-index:
        8;

    font-size:
        clamp(
            1.05rem,
            2.1vw,
            1.5rem
        );

    line-height:
        1.65;

    color:
        #fff6cf;

    text-shadow:
        0 2px 8px
        rgba(0, 0, 0, .8);

    transition:
        opacity 1s ease;

}

.letter.show {

    opacity:
        1;

}


/* =========================
   TEXTO ESCRITO
========================= */

#typed {

    white-space:
        pre-line;

}


/* =========================
   CURSOR
========================= */

.cursor {

    display:
        inline-block;

    width:
        2px;

    height:
        1em;

    margin-left:
        3px;

    vertical-align:
        -2px;

    background:
        #ffe36a;

    animation:
        blink .7s infinite;

}

@keyframes blink {

    50% {

        opacity:
            0;

    }

}


/* =========================
   FIRMA

   IMPORTANTE:
   Ya NO usa position absolute.

   De esta forma siempre aparecerá
   debajo del mensaje.
========================= */

.signature {

    margin-top:
        22px;

    opacity:
        0;

    font-size:
        1.05em;

    font-style:
        italic;

    font-weight:
        bold;

    color:
        #ffe36a;

    transform:
        translateY(10px);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

    text-shadow:
        0 2px 8px
        rgba(0, 0, 0, .8);

}

.signature.show {

    opacity:
        1;

    transform:
        translateY(0);

}


/* =========================
   RAMO
========================= */

.bouquet {

    position:
        absolute;

    right:
        5%;

    bottom:
        4%;

    width:
        min(
            54vw,
            540px
        );

    height:
        min(
            78vh,
            650px
        );

    opacity:
        0;

    transition:
        opacity .5s ease;

}

.bouquet.show {

    opacity:
        1;

}


/* =========================
   FLORES
========================= */

.flower {

    position:
        absolute;

    left:
        50%;

    bottom:
        80px;

    width:
        110px;

    height:
        110px;

    opacity:
        0;

    transform-origin:
        50% 170%;

    transform:
        translate(
            -50%,
            40px
        )
        rotate(
            var(--r)
        )
        scale(.15);

    transition:
        opacity .65s ease,
        transform 1.1s
        cubic-bezier(
            .2,
            .8,
            .2,
            1
        );

}

.flower.grow {

    opacity:
        1;

    transform:
        translate(
            calc(
                -50% + var(--x)
            ),
            var(--y)
        )
        rotate(
            var(--r)
        )
        scale(
            var(--s)
        );

}


/* =========================
   TALLOS
========================= */

.stem {

    position:
        absolute;

    width:
        6px;

    height:
        250px;

    left:
        52px;

    top:
        53px;

    background:
        linear-gradient(
            90deg,
            #164a2a,
            #4c9a4b,
            #153b25
        );

    border-radius:
        6px;

    transform-origin:
        top;

    z-index:
        -1;

}


/* =========================
   PÉTALOS
========================= */

.petal {

    position:
        absolute;

    left:
        41px;

    top:
        9px;

    width:
        28px;

    height:
        55px;

    border-radius:
        60% 60% 45% 45%;

    background:
        linear-gradient(
            #fff47d,
            #ffc928
        );

    transform-origin:
        14px 46px;

    box-shadow:
        0 0 8px
        rgba(255, 215, 57, .35);

}


/* =========================
   CENTRO DE LA FLOR
========================= */

.center {

    position:
        absolute;

    left:
        35px;

    top:
        35px;

    width:
        40px;

    height:
        40px;

    border-radius:
        50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #9d7128,
            #4d2a0b 72%
        );

    z-index:
        3;

}


/* =========================
   PAPEL DEL RAMO
========================= */

.wrap {

    position:
        absolute;

    left:
        50%;

    bottom:
        18px;

    transform:
        translateX(-50%);

    width:
        260px;

    height:
        160px;

    background:
        linear-gradient(
            135deg,
            #f0d9a7,
            #c89f61
        );

    clip-path:
        polygon(
            8% 0,
            92% 0,
            68% 100%,
            32% 100%
        );

    opacity:
        0;

    transition:
        opacity 1s ease;

    z-index:
        5;

}

.wrap.show {

    opacity:
        .92;

}


/* =========================
   CINTA
========================= */

.ribbon {

    position:
        absolute;

    left:
        50%;

    bottom:
        82px;

    transform:
        translateX(-50%);

    width:
        110px;

    height:
        24px;

    border-radius:
        50%;

    background:
        #d7a926;

    opacity:
        0;

    transition:
        opacity 1s ease;

    z-index:
        7;

}

.ribbon.show {

    opacity:
        1;

}


/* =========================
   LUCES DE FONDO
========================= */

.spark {

    position:
        absolute;

    width:
        5px;

    height:
        5px;

    border-radius:
        50%;

    background:
        #fff3a4;

    opacity:
        .5;

    pointer-events:
        none;

    animation:
        float 5s linear infinite;

}

@keyframes float {

    to {

        transform:
            translateY(-90px);

        opacity:
            0;

    }

}


/* =========================
   CELULAR
========================= */

@media (max-width: 650px) {

    body {

        overflow:
            hidden;

    }


    .scene {

        padding:
            16px;

    }


    /* TEXTO ARRIBA */

    .letter {

        left:
            7%;

        top:
            6%;

        width:
            86%;

        font-size:
            clamp(
                .95rem,
                4.4vw,
                1.12rem
            );

        line-height:
            1.48;

    }


    /* Firma ahora fluye debajo
       del texto automáticamente */

    .signature {

        margin-top:
            16px;

        font-size:
            1.05rem;

    }


    /* RAMO ABAJO */

    .bouquet {

        right:
            -5%;

        bottom:
            -4%;

        width:
            100%;

        height:
            58vh;

        transform:
            scale(.72);

        transform-origin:
            bottom right;

    }


    .intro {

        margin-top:
            -70px;

    }

}


/* =========================
   CELULARES PEQUEÑOS
========================= */

@media (max-width: 390px) {

    .letter {

        top:
            4%;

        font-size:
            .94rem;

        line-height:
            1.4;

    }


    .signature {

        margin-top:
            12px;

        font-size:
            .98rem;

    }


    .bouquet {

        transform:
            scale(.65);

        right:
            -8%;

        bottom:
            -5%;

    }

}

</style>

</head>


<body>


<!-- =========================
     MÚSICA
========================= -->

<audio
    id="backgroundMusic"
    loop>

    <source
        src="audio.mp3"
        type="audio/mpeg">

    <source
        src="audio.mp4"
        type="audio/mp4">

</audio>



<!-- =========================
     ESCENA
========================= -->

<main class="scene">


    <!-- =====================
         INICIO
    ====================== -->

    <section
        class="intro"
        id="intro">

        <h1>
            Tengo algo para ti 💛
        </h1>

        <p>
            Haz clic y mira cómo florece.
        </p>

        <button
            id="open"
            type="button">

            Toca aquí 🌻

        </button>

    </section>



    <!-- =====================
         MENSAJE + FIRMA
    ====================== -->

    <div
        class="letter"
        id="letter">

        <span
            id="typed">
        </span>

        <span
            class="cursor"
            id="cursor">
        </span>


        <!--
        IMPORTANTE:
        La firma está DENTRO
        del mismo contenedor.
        -->

        <div
            class="signature"
            id="signature">

            Con amor, Bryan ❤️

        </div>

    </div>



    <!-- =====================
         RAMO
    ====================== -->

    <div
        class="bouquet"
        id="bouquet">

        <div
            class="wrap"
            id="wrap">
        </div>

        <div
            class="ribbon"
            id="ribbon">
        </div>

    </div>


</main>



<script>

/* =========================
   ELEMENTOS
========================= */

const intro =
    document.getElementById(
        "intro"
    );

const bouquet =
    document.getElementById(
        "bouquet"
    );

const letter =
    document.getElementById(
        "letter"
    );

const typed =
    document.getElementById(
        "typed"
    );

const wrap =
    document.getElementById(
        "wrap"
    );

const ribbon =
    document.getElementById(
        "ribbon"
    );

const btn =
    document.getElementById(
        "open"
    );

const music =
    document.getElementById(
        "backgroundMusic"
    );

const signature =
    document.getElementById(
        "signature"
    );

const cursor =
    document.getElementById(
        "cursor"
    );


/* =========================
   POSICIONES DEL RAMO
========================= */

const positions = [

    [-150, -5, -27, .72],

    [-105, -95, -19, .82],

    [-45, -145, -9, .95],

    [20, -165, 3, 1.05],

    [85, -125, 13, .92],

    [145, -45, 25, .78],

    [-120, -175, -20, .75],

    [-65, -225, -11, .85],

    [5, -245, 1, 1],

    [75, -220, 12, .86],

    [125, -155, 21, .76],

    [-65, -310, -8, .72],

    [5, -330, 1, .8],

    [70, -300, 10, .72]

];


/* =========================
   CREAR FLOR
========================= */

function makeFlower(
    x,
    y,
    r,
    s,
    i
) {

    const flower =
        document.createElement(
            "div"
        );


    flower.className =
        "flower";


    flower.style.setProperty(
        "--x",
        x + "px"
    );

    flower.style.setProperty(
        "--y",
        y + "px"
    );

    flower.style.setProperty(
        "--r",
        r + "deg"
    );

    flower.style.setProperty(
        "--s",
        s
    );


    let petals =
        "";


    /* 10 pétalos */

    for (
        let j = 0;
        j < 10;
        j++
    ) {

        petals += `

            <i
                class="petal"

                style="
                transform:
                rotate(${j * 36}deg)
                translateY(-29px);
                ">
            </i>

        `;

    }


    flower.innerHTML = `

        <div
            class="stem">
        </div>

        ${petals}

        <div
            class="center">
        </div>

    `;


    bouquet.appendChild(
        flower
    );


    /* =====================
       FLORECER
       UNA POR UNA
    ====================== */

    setTimeout(
        () => {

            flower.classList.add(
                "grow"
            );

        },

        500 +
        i * 260

    );

}


/* =========================
   ESCRIBIR MENSAJE
========================= */

function typeMessage() {


    const msg =

`Para ti, mi amore 💛

No quería dejar pasar este día
sin regalarte flores amarillas.

Que cada una te recuerde
lo especial que eres para mí

y lo bonito que es
tenerte en mi vida. 🌻💛`;


    let i =
        0;


    letter.classList.add(
        "show"
    );


    const typing =
        setInterval(
            () => {


                /*
                Agregamos una letra
                en cada intervalo.
                */

                typed.textContent +=
                    msg.charAt(i);


                i++;


                /* =================
                   TERMINÓ EL TEXTO
                ================= */

                if (
                    i >=
                    msg.length
                ) {


                    clearInterval(
                        typing
                    );


                    /* =================
                       QUITAR CURSOR
                    ================= */

                    setTimeout(
                        () => {

                            cursor.style.display =
                                "none";

                        },

                        400
                    );


                    /* =================
                       MOSTRAR FIRMA
                    ================= */

                    setTimeout(
                        () => {

                            signature
                            .classList
                            .add(
                                "show"
                            );

                        },

                        900
                    );

                }

            },

            45

        );

}


/* =========================
   CLICK PRINCIPAL
========================= */

btn.addEventListener(
    "click",

    () => {


        /* =====================
           EVITAR DOBLE CLICK
        ====================== */

        btn.disabled =
            true;


        /* =====================
           INICIAR MÚSICA
        ====================== */

        music.volume =
            0.5;


        music.play()
        .catch(
            error => {

                console.log(
                    "No se pudo iniciar la música:",
                    error
                );

            }
        );


        /* =====================
           OCULTAR INTRO
        ====================== */

        intro.classList.add(
            "hide"
        );


        /* =====================
           MOSTRAR RAMO
        ====================== */

        bouquet.classList.add(
            "show"
        );


        /* =====================
           CREAR FLORES
        ====================== */

        positions.forEach(
            (
                position,
                i
            ) => {

                makeFlower(
                    ...position,
                    i
                );

            }
        );


        /* =====================
           PAPEL
        ====================== */

        setTimeout(
            () => {

                wrap
                .classList
                .add(
                    "show"
                );

            },

            3600
        );


        /* =====================
           CINTA
        ====================== */

        setTimeout(
            () => {

                ribbon
                .classList
                .add(
                    "show"
                );

            },

            3900
        );


        /* =====================
           MENSAJE
        ====================== */

        setTimeout(
            () => {

                typeMessage();

            },

            4300
        );


    }
);


/* =========================
   LUCES DEL FONDO
========================= */

for (
    let i = 0;
    i < 25;
    i++
) {


    const spark =
        document.createElement(
            "b"
        );


    spark.className =
        "spark";


    spark.style.left =
        (
            Math.random()
            * 100
        )
        + "%";


    spark.style.top =
        (
            30
            +
            Math.random()
            * 70
        )
        + "%";


    spark.style.animationDelay =
        (
            -Math.random()
            * 5
        )
        + "s";


    document.body.appendChild(
        spark
    );

}

</script>


</body>

</html>
