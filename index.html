<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Un ramo para ti 💛</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, serif;
    color: #fff;

    background:
        radial-gradient(circle at 70% 70%, #183b2a 0, transparent 32%),
        linear-gradient(145deg, #07131d, #102d30 60%, #0b1e19);
}

.scene {
    min-height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

/* =========================
   PANTALLA INICIAL
========================= */

.intro {
    text-align: center;
    z-index: 20;
    transition: opacity .8s, transform .8s;
}

.intro.hide {
    opacity: 0;
    transform: scale(.9);
    pointer-events: none;
}

.intro h1 {
    color: #ffe36a;
    font-size: clamp(2rem, 9vw, 4rem);
    margin: 0 0 12px;
}

.intro p {
    color: #fff4c2;
}

.intro button {
    border: 0;
    border-radius: 999px;
    padding: 15px 24px;

    font-size: 17px;
    font-weight: bold;

    background: #f5ca36;
    color: #352600;

    box-shadow: 0 0 25px #ffd84b55;

    cursor: pointer;
}

/* =========================
   MENSAJE
========================= */

.letter {
    position: absolute;

    left: 6%;
    top: 18%;

    width: min(37%, 430px);

    opacity: 0;

    z-index: 8;

    font-size: clamp(1.05rem, 2.2vw, 1.55rem);
    line-height: 1.7;

    color: #fff6cf;

    text-shadow: 0 2px 8px #000;
}

.letter.show {
    opacity: 1;
}

.cursor {
    display: inline-block;

    width: 2px;
    height: 1em;

    background: #ffe36a;

    vertical-align: -2px;

    animation: blink .7s infinite;
}

@keyframes blink {

    50% {
        opacity: 0;
    }

}

/* =========================
   RAMO
========================= */

.bouquet {

    position: absolute;

    right: 5%;
    bottom: 4%;

    width: min(54vw, 540px);
    height: min(78vh, 650px);

    opacity: 0;

    transition: opacity .5s;
}

.bouquet.show {
    opacity: 1;
}

/* =========================
   FLORES
========================= */

.flower {

    position: absolute;

    left: 50%;
    bottom: 80px;

    width: 110px;
    height: 110px;

    opacity: 0;

    transform-origin: 50% 170%;

    transform:
        translate(-50%, 40px)
        rotate(var(--r))
        scale(.15);

    transition:
        opacity .65s,
        transform 1.1s cubic-bezier(.2,.8,.2,1);
}

.flower.grow {

    opacity: 1;

    transform:
        translate(
            calc(-50% + var(--x)),
            var(--y)
        )
        rotate(var(--r))
        scale(var(--s));
}

/* TALLO */

.stem {

    position: absolute;

    width: 6px;
    height: 250px;

    left: 52px;
    top: 53px;

    background:
        linear-gradient(
            90deg,
            #164a2a,
            #4c9a4b,
            #153b25
        );

    border-radius: 6px;

    transform-origin: top;

    z-index: -1;
}

/* PÉTALOS */

.petal {

    position: absolute;

    left: 41px;
    top: 9px;

    width: 28px;
    height: 55px;

    border-radius:
        60% 60% 45% 45%;

    background:
        linear-gradient(
            #fff47d,
            #ffc928
        );

    transform-origin:
        14px 46px;

    box-shadow:
        0 0 8px #ffd73955;
}

/* CENTRO */

.center {

    position: absolute;

    left: 35px;
    top: 35px;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #9d7128,
            #4d2a0b 72%
        );

    z-index: 3;
}

/* =========================
   PAPEL DEL RAMO
========================= */

.wrap {

    position: absolute;

    left: 50%;
    bottom: 18px;

    transform:
        translateX(-50%);

    width: 260px;
    height: 160px;

    background:
        linear-gradient(
            135deg,
            #f0d9a7,
            #c89f61
        );

    clip-path:
        polygon(
            8% 0,
            92% 0,
            68% 100%,
            32% 100%
        );

    opacity: 0;

    transition:
        opacity 1s;

    z-index: 5;
}

.wrap.show {
    opacity: .92;
}

/* CINTA */

.ribbon {

    position: absolute;

    left: 50%;
    bottom: 82px;

    transform:
        translateX(-50%);

    width: 110px;
    height: 24px;

    border-radius: 50%;

    background:
        #d7a926;

    opacity: 0;

    z-index: 7;
}

.ribbon.show {
    opacity: 1;
}

/* =========================
   LUCES
========================= */

.spark {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        #fff3a4;

    opacity: .5;

    animation:
        float 5s linear infinite;
}

@keyframes float {

    to {

        transform:
            translateY(-90px);

        opacity: 0;
    }

}

/* =========================
   CELULAR
========================= */

@media(max-width:650px) {

    .letter {

        left: 7%;
        top: 8%;

        width: 86%;

        font-size: 1.05rem;
    }

    .bouquet {

        right: -4%;
        bottom: 0;

        width: 100%;
        height: 62vh;

        transform:
            scale(.8);

        transform-origin:
            bottom right;
    }

    .intro {
        margin-top: -80px;
    }

}

</style>
</head>


<body>


<!-- =========================
     MÚSICA
========================= -->

<audio id="backgroundMusic" loop>

    <source
        src="audio.mp3"
        type="audio/mpeg">

    <source
        src="audio.mp4"
        type="audio/mp4">

</audio>


<!-- =========================
     CONTENIDO
========================= -->

<main class="scene">


<section
    class="intro"
    id="intro">

    <h1>
        Tengo algo para ti 💛
    </h1>

    <p>
        Haz clic y mira cómo florece.
    </p>

    <button id="open">
        Toca aquí 🌻
    </button>

</section>



<!-- MENSAJE -->

<div
    class="letter"
    id="letter">

    <span id="typed"></span>

    <span class="cursor"></span>

</div>



<!-- RAMO -->

<div
    class="bouquet"
    id="bouquet">

    <div
        class="wrap"
        id="wrap">
    </div>

    <div
        class="ribbon"
        id="ribbon">
    </div>

</div>


</main>


<script>

/* =========================
   ELEMENTOS
========================= */

const intro =
    document.getElementById("intro");

const bouquet =
    document.getElementById("bouquet");

const letter =
    document.getElementById("letter");

const typed =
    document.getElementById("typed");

const wrap =
    document.getElementById("wrap");

const ribbon =
    document.getElementById("ribbon");

const btn =
    document.getElementById("open");

const music =
    document.getElementById("backgroundMusic");


/* =========================
   POSICIONES DE FLORES
========================= */

const positions = [

    [-150,-5,-27,.72],

    [-105,-95,-19,.82],

    [-45,-145,-9,.95],

    [20,-165,3,1.05],

    [85,-125,13,.92],

    [145,-45,25,.78],

    [-120,-175,-20,.75],

    [-65,-225,-11,.85],

    [5,-245,1,1],

    [75,-220,12,.86],

    [125,-155,21,.76],

    [-65,-310,-8,.72],

    [5,-330,1,.8],

    [70,-300,10,.72]

];


/* =========================
   CREAR FLOR
========================= */

function makeFlower(
    x,
    y,
    r,
    s,
    i
) {

    const flower =
        document.createElement("div");

    flower.className =
        "flower";


    flower.style.setProperty(
        "--x",
        x + "px"
    );

    flower.style.setProperty(
        "--y",
        y + "px"
    );

    flower.style.setProperty(
        "--r",
        r + "deg"
    );

    flower.style.setProperty(
        "--s",
        s
    );


    let petals = "";


    for (
        let j = 0;
        j < 10;
        j++
    ) {

        petals += `

        <i
        class="petal"
        style="
        transform:
        rotate(${j * 36}deg)
        translateY(-29px)
        ">
        </i>

        `;

    }


    flower.innerHTML = `

        <div class="stem"></div>

        ${petals}

        <div class="center"></div>

    `;


    bouquet.appendChild(
        flower
    );


    /* aparecer una por una */

    setTimeout(() => {

        flower.classList.add(
            "grow"
        );

    }, 500 + i * 260);

}


/* =========================
   MENSAJE ESCRIBIÉNDOSE
========================= */

function typeMessage() {

    const msg =

`Para ti, mi amor 💛

No quería dejar pasar este día
sin regalarte flores amarillas.

Que cada una te recuerde
lo especial que eres para mí

y lo bonito que es
tenerte en mi vida. 🌻💛`;


    let i = 0;


    letter.classList.add(
        "show"
    );


    typed.style.whiteSpace =
        "pre-line";


    const typing =
        setInterval(() => {


            typed.textContent +=
                msg[i];


            i++;


            if (
                i >= msg.length
            ) {

                clearInterval(
                    typing
                );

            }


        }, 45);

}


/* =========================
   CLICK PRINCIPAL
========================= */

btn.addEventListener(
    "click",
    () => {


        /* =================
           INICIAR MÚSICA
        ================= */

        music.volume = 0.5;


        music.play()
        .catch(error => {

            console.log(
                "No se pudo iniciar la música:",
                error
            );

        });


        /* ocultar inicio */

        btn.disabled = true;

        intro.classList.add(
            "hide"
        );


        /* mostrar ramo */

        bouquet.classList.add(
            "show"
        );


        /* generar flores */

        positions.forEach(
            (position, i) => {

                makeFlower(
                    ...position,
                    i
                );

            }
        );


        /* papel */

        setTimeout(
            () =>
            wrap.classList.add(
                "show"
            ),
            3600
        );


        /* cinta */

        setTimeout(
            () =>
            ribbon.classList.add(
                "show"
            ),
            3900
        );


        /* mensaje */

        setTimeout(
            typeMessage,
            4300
        );


    }
);


/* =========================
   LUCES DE FONDO
========================= */

for (
    let i = 0;
    i < 25;
    i++
) {

    const spark =
        document.createElement(
            "b"
        );


    spark.className =
        "spark";


    spark.style.left =
        Math.random() * 100
        + "%";


    spark.style.top =
        (
            30 +
            Math.random() * 70
        )
        + "%";


    spark.style.animationDelay =
        (
            -Math.random() * 5
        )
        + "s";


    document.body.appendChild(
        spark
    );

}

</script>

</body>
</html>
